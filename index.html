<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: één zachte kolom; bovenaan een rij genummerde bolletjes per stap; elke vraag een eigen afgeronde kaart met pill-knoppen. */
:root{
  --bg:#F3E8E1; --card:#FFFBF8; --ink:#142B1B; --ink-2:#3E4F43; --muted:#7C847C; --line:#EADCD2; --line-2:#D6C6BA;
  --accent:#142B1B; --accent-ink:#FFFBF8; --soft:#E4E9E2; --soft-2:#F8F1EC; --warn:#9A5A12; --warn-soft:#FBEFDF; --ok:#2B6A45;
  --wa:#1E9E55; --wa-ink:#FFFFFF;
  --f-body:Manrope, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-display:Outfit, Manrope, ui-sans-serif, system-ui, sans-serif;
  --r-card:22px; --r-field:14px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1711; --card:#16221A; --ink:#F1E7E0; --ink-2:#C9BFB8; --muted:#948C86; --line:#24332A; --line-2:#344538;
  --accent:#EADBCF; --accent-ink:#142B1B; --soft:#2A3A2F; --soft-2:#1B281F; --warn:#E8B46E; --warn-soft:#2B2217; --ok:#A9D3B6;
  --wa:#36C275; --wa-ink:#06140C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1711; --card:#16221A; --ink:#F1E7E0; --ink-2:#C9BFB8; --muted:#948C86; --line:#24332A; --line-2:#344538;
  --accent:#EADBCF; --accent-ink:#142B1B; --soft:#2A3A2F; --soft-2:#1B281F; --warn:#E8B46E; --warn-soft:#2B2217; --ok:#A9D3B6;
  --wa:#36C275; --wa-ink:#06140C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{padding-block:28px 8px}
.brand{display:inline-flex;align-items:center}
.brand img{height:34px;width:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand img{filter:brightness(0) invert(.93) sepia(.15)}}
:root[data-theme="dark"] .brand img{filter:brightness(0) invert(.93) sepia(.15)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(32px,6vw,46px);line-height:1.05;letter-spacing:-.015em;margin:18px 0 6px;text-wrap:balance}
.lead{color:var(--ink-2);margin:0;max-width:56ch}

/* stappen als bolletjes */
.steps{display:flex;align-items:center;gap:0;overflow-x:auto;padding:22px 2px 6px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.dot{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line-2);background:var(--card);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:all .2s}
.dot.done{background:var(--soft);border-color:var(--soft);color:var(--accent)}
.dot.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.08)}
.link{flex:1 0 14px;min-width:14px;height:2px;background:var(--line-2)}
.link.done{background:var(--accent);opacity:.5}
.steplabel{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}

main{padding-block:14px 80px;display:flex;flex-direction:column;gap:14px}
.sec h2{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4.5vw,34px);line-height:1.1;margin:6px 0 4px}
.sec p{margin:0;color:var(--ink-2)}

.q{background:var(--card);border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:12px;border:2px solid transparent;transition:border-color .2s}
.q.missing{border-color:var(--warn)}
.qlabel{font-weight:700;font-size:17px;line-height:1.35;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.req{font-size:12px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
.req::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.q.missing .req{color:var(--warn)}
.q.missing .req::before{background:var(--warn)}
.help{font-size:14px;color:var(--muted);margin:-6px 0 0}
.q.parked .control{opacity:.35;pointer-events:none}

input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],textarea{
  width:100%;background:var(--soft-2);border:2px solid transparent;border-radius:var(--r-field);padding:13px 16px;outline:none;transition:border-color .15s,background .15s}
input:focus,textarea:focus{border-color:var(--accent);background:var(--card)}
textarea{min-height:110px;resize:vertical}
::placeholder{color:var(--muted);opacity:1}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:10px 18px 10px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--ink);transition:all .15s}
.pill:hover{border-color:var(--line-2)}
.pill .b{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;transition:all .15s}
.pill.multi .b{border-radius:50%}
.pill[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.pill[aria-pressed="true"] .b{background:var(--accent);border-color:var(--accent)}
.pill[aria-pressed="true"] .b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.pill.multi[aria-pressed="true"] .b::after{width:auto;height:auto;background:none;content:"✓";color:var(--accent-ink);font-size:12px;font-weight:800}
.other{max-width:340px}

.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bigc{border:2px solid var(--line);background:var(--card);border-radius:var(--r-card);padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:all .15s}
.bigc:hover{border-color:var(--line-2)}
.bigc[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.bigc .ic{width:48px;height:48px;border-radius:50%;background:var(--soft-2);display:grid;place-items:center}
.bigc[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-ink)}
.bigc .ic svg{width:24px;height:24px}
.bigc .bt2{display:flex;flex-direction:column;gap:4px}
.bigc b{font-size:17px}
.bigc span{font-size:14px;color:var(--ink-2)}

.later{align-self:flex-start;border:2px dashed var(--line-2);background:none;border-radius:var(--r-pill);padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.later[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--soft-2)}

/* upload */
.drop{border:2px dashed var(--line-2);border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;background:var(--soft-2);transition:all .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--soft)}
.drop .ic{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--accent)}
.drop b{font-size:15px}
.drop span{font-size:13px;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.th{position:relative;width:86px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2)}
.th .im{width:86px;height:86px;border-radius:16px;background:var(--soft-2);background-size:cover;background-position:center;display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:12px;overflow:hidden}
.th .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--card);cursor:pointer;font-size:14px;line-height:1}
.th .st{color:var(--ok);font-weight:700}
.linkin{margin-top:2px}

/* media-rijen */
.mrows{display:flex;flex-direction:column;gap:10px}
.mrow{border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mrow h4{margin:0;font-size:15.5px}
.mrow p{margin:-6px 0 0;font-size:13.5px;color:var(--muted)}

/* kleuren als bollen */
.swatches{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sw{position:relative;width:58px;height:58px;border-radius:50%;border:2px dashed var(--line-2);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:24px;overflow:hidden}
.sw.set{border:3px solid var(--card);box-shadow:0 0 0 2px var(--line-2)}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.swl{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
.swwrap{display:flex;flex-direction:column;align-items:center}
.swx{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0}

/* stijlen */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sc{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.sc[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.sc .cap{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:0 4px 2px}
.sc .b{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:11px}
.sc[aria-pressed="true"] .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sc[aria-pressed="true"] .b::after{content:"✓";font-weight:800}
.mock{--mb:#fff;--mf:#111;--ma:#111;--mi:#ddd;--mr:0px;aspect-ratio:4/3;max-width:100%;border-radius:14px;background:var(--mb);color:var(--mf);padding:7px 8px;display:flex;flex-direction:column;gap:5px;overflow:hidden;font-family:var(--mfont)}
.mock .mn{display:flex;justify-content:space-between;align-items:center;font-size:8.5px;font-weight:700}
.mock .mn span{display:flex;gap:3px}
.mock .mn span i{display:block;width:10px;height:2px;background:currentColor;opacity:.5}
.mock .mh{flex:1;display:grid;gap:5px;min-height:0}
.mock .img{background:var(--mi);border-radius:var(--mr)}
.mock .tx{display:flex;flex-direction:column;gap:3px;justify-content:center}
.mock .t1{font-size:13px;line-height:1}
.mock .ln{height:2px;background:currentColor;opacity:.35;width:80%}
.mock .bt{margin-top:2px;width:30px;height:8px;background:var(--ma);border-radius:var(--mr)}
.mock .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;height:22%}
.mock .tiles i{background:var(--mi);border-radius:var(--mr);opacity:.8}
.mock[data-l="center"] .mh{grid-template-rows:1fr auto;text-align:center}
.mock[data-l="center"] .tx{align-items:center}
.mock[data-l="split"] .mh{grid-template-columns:1fr 1fr}
.mock[data-l="full"] .mh{position:relative}
.mock[data-l="full"] .img{position:absolute;inset:0}
.mock[data-l="full"] .tx{position:relative;padding:6px}
.mock[data-l="big"] .mh{grid-template-rows:auto 1fr}
.mock[data-l="big"] .t1{font-size:19px;text-transform:uppercase;font-weight:800}

.refs{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:14px 26px;border-radius:var(--r-pill);cursor:pointer;font-weight:700;font-size:15.5px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line-2)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink);font-size:17px;padding:16px 28px}
.btn.wa svg{width:22px;height:22px}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}

.panel{background:var(--card);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:18px}
.misslist{display:flex;flex-wrap:wrap;gap:8px}
.misslist button{border:2px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:var(--r-pill);padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.status{font-size:14px;color:var(--ink-2);margin:0}
.status.ok{color:var(--ok)} .status.err{color:var(--warn)}
.filelist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.filelist li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:2px}
.tip{background:var(--soft-2);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--ink-2)}
.copybox{width:100%;min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

@media (max-width:520px){
  .q{padding:18px}
  .rrow{grid-template-columns:minmax(0,1fr)}
  .nav .btn{flex:1}
  .dot{width:34px;height:34px}
  .bigc{flex-direction:row;align-items:center;padding:14px 16px;gap:14px}
  .bigc .ic{flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.steps,.nav,.actions,.later,.ghost{display:none!important}body{background:#fff}}
</style>

  copy.addEventListener("click", async () => {
    const t = toText();
    try { await navigator.clipboard.writeText(t); status.className = "status ok"; status.textContent = `Gekopieerd. Plak het in een WhatsApp-bericht aan ${WIE}.`; }
    catch(e) { const ta = el("textarea", {class:"copybox", readonly:true, "aria-label":"Je antwoorden"}); ta.value = t; card.append(ta); ta.focus(); ta.select(); status.className = "status"; status.textContent = "Kopiëren lukte niet automatisch. Selecteer de tekst hieronder en kopieer hem."; }
  });
  const fname = ext => `intake-${(A.b_naam || "klant").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}-${new Date().toISOString().slice(0, 10)}.${ext}`;
  async function dl(ext, data){
    const d = window.claude ? await window.claude.use("downloads") : null;
    if (d) { try { await d.save({filename:fname(ext), data}); status.className = "status ok"; status.textContent = "Opgeslagen."; } catch(e) { status.className = "status err"; status.textContent = e && e.code === "declined" ? "Opslaan geannuleerd." : "Opslaan lukte hier niet. Gebruik Kopieer antwoorden."; } return; }
    const a = el("a", {href:URL.createObjectURL(new Blob([data], {type: ext === "json" ? "application/json" : "text/markdown"})), download:fname(ext)}); document.body.append(a); a.click(); a.remove();
  }
  dMd.addEventListener("click", () => dl("md", toText()));
  dJson.addEventListener("click", () => dl("json", JSON.stringify(toJSON(), null, 2)));
  prt.addEventListener("click", () => window.print());
  if (!window.claude) { dMd.hidden = dJson.hidden = prt.hidden = false; }
  else (async () => {
    if (await window.claude.use("downloads")) dMd.hidden = dJson.hidden = false;
    const db = await window.claude.use("db"); if (!db) return;
    saveDb.hidden = false;
    saveDb.addEventListener("click", async () => {
      saveDb.disabled = true; status.className = "status"; status.textContent = "Bezig met opslaan…";
      try { if (!A.__docid) { A.__docid = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); save(); }
        await db.collection("intakes").doc(A.__docid).set(toJSON()); status.className = "status ok"; status.textContent = "Opgeslagen. Opnieuw opslaan werkt dezelfde intake bij."; }
      catch(e) { status.className = "status err"; status.textContent = "Opslaan lukte niet. Verstuur via WhatsApp."; }
      saveDb.disabled = false;
    });
  })();
}

/* ---------- export ---------- */
function fmt(q){
  const a = A[q.id], out = [];
  if (A[q.id + "__later"]) out.push("[lever ik later aan]");
  if (a == null || a === "" || (Array.isArray(a) && !a.length && !A[q.id + "__other"])) return out.join(" ");
  const lab = v => { const o = (q.opts || []).find(o => ov(o) === v); return o ? ol(o) : v; };
  const fl = v => [(v.files || []).map(f => f.url ? `${f.name} (${f.url})` : f.name).join(", "), v.link ? "link: " + v.link : ""].filter(Boolean).join(" · ");
  switch(q.type){
    case "pills": out.push(lab(a)); break;
    case "chips": out.push([...a.map(lab), A[q.id + "__other"] ? "anders: " + A[q.id + "__other"] : null].filter(Boolean).join(", ")); break;
    case "styles": out.push(a.map(k => (DATA.styles.find(s => s[0] === k) || [k, k])[1]).join(", ")); break;
    case "colors": out.push(a.filter(Boolean).join(", ")); break;
    case "refs": out.push(a.filter(r => r && r.url).map(r => r.url + (r.note ? ` (${r.note})` : "")).join("; ")); break;
    case "upload": out.push(fl(a) || "—"); break;
    case "media": out.push(mediaRows(q).map(([k, l]) => { const r = a[k]; if (!r || !r.status) return null; const f = fl(r); return `\n   - ${l}: ${r.status}${f ? " · " + f : ""}`; }).filter(Boolean).join("")); break;
    default: out.push(String(a));
  }
  return out.join(" ");
}
function toText(){
  const L = [`*Klantintake ${A.b_naam || ""}*`.replace(" *", "*"), `Ingevuld op ${new Date().toLocaleDateString("nl-NL", {day:"numeric", month:"long", year:"numeric"})}`, ""];
  steps().forEach(s => { if (!s.questions) return;
    const rows = s.questions.filter(qVisible).map(q => [q, fmt(q)]).filter(([, v]) => v);
    if (!rows.length) return;
    L.push(`*${s.title}*`); rows.forEach(([q, v]) => L.push(`- ${q.label}: ${v}`)); L.push(""); });
  const miss = missing(); if (miss.length) L.push(`Nog open: ${miss.map(([q]) => q.label).join("; ")}`);
  return L.join("\n").trim();
}
function waText(){
  const head = `Hallo ${WIE}, hier is mijn intake voor de nieuwe website.\n\n`;
  const full = head + toText();
  if (encodeURIComponent(full).length < 30000) return {text: full, full: true};
  const lab = id => ALLQ[id] ? fmt(ALLQ[id]) : "";
  return {full:false, text: head + [`*Samenvatting ${A.b_naam || ""}*`, `Type: ${lab("p_type")}`, `Contact: ${A.c_naam || ""} ${A.c_tel || ""}`, `Stijl: ${lab("s_stijl")}`, `Live: ${lab("x_wanneer")}`, `Budget: ${lab("x_budget")}`, "", "Het volledige document stuur ik hierna mee."].join("\n")};
}
function toJSON(){
  const ant = {};
  steps().forEach(s => (s.questions || []).filter(qVisible).forEach(q => {
    ant[q.id] = {vraag:q.label, stap:s.title, verplicht:!!q.req, antwoord:A[q.id] ?? null, leesbaar:fmt(q)};
    if (A[q.id + "__other"]) ant[q.id].anders = A[q.id + "__other"];
    if (A[q.id + "__later"]) ant[q.id].later_aanleveren = true;
  }));
  return {schema:"klantintake/2", ingevuld:new Date().toISOString(), type:A.p_type || null, bedrijf:A.b_naam || null,
    open_verplicht:missing().map(([q]) => q.id), bestanden:allFiles().map(([l, f]) => ({onderdeel:l, naam:f.name, url:f.url || null})), antwoorden:ant};
}
